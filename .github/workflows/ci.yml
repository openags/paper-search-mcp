name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12', '3.13']
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv pip install --system -e ".[dev]"

      - name: Compile source
        run: python -m compileall -q paper_search_mcp tests

      - name: Run deterministic tests
        run: >
          python -m pytest
          tests/test_package_entrypoints.py
          tests/test_cli_sort.py
          tests/test_cli_tools.py
          tests/test_feature_integration.py
          tests/test_cli_sources.py
          tests/test_wos.py
          tests/test_scopus.py
          tests/test_institutional_http.py
          tests/test_semantic_rate_limits.py
          tests/test_semantic_pdf_validation.py
          tests/test_cli_diagnostics.py
          tests/test_config_env.py
          tests/test_unpaywall.py
          tests/test_unpaywall_source.py
          tests/test_tool_schema_compat.py
          tests/test_mcp_stdio.py
          tests/test_server_transport.py
          tests/test_http_auth.py
          tests/test_stabilization_regressions.py
          tests/test_search_timeouts.py
          tests/test_google_scholar_errors.py
          tests/test_arxiv_406.py
          tests/test_arxiv.py::TestArxivRateLimiting
          tests/test_biorxiv_search_modes.py
          tests/test_openreview.py
          tests/test_ssrn_openalex.py
          tests/test_ssrn.py
          tests/test_openalex.py
          tests/test_openalex_relations.py
          tests/test_search_cache.py
          tests/test_ieee.py
          tests/test_dsh_bundle.py
          tests/test_skill_archive_docs.py
          tests/test_skill_zip_builder.py
          tests/test_acm.py
          tests/test_fallback.py
          tests/test_paper.py
          -q --tb=short
