name: Publish to PyPI

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12', '3.13']
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: |
          uv sync --frozen --extra dev --python "${{ matrix.python-version }}"
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Compile source
        run: python -m compileall -q paper_search_mcp tests

      - name: Run deterministic tests
        run: >
          python -m pytest
          tests/test_package_entrypoints.py
          tests/test_cli_sort.py
          tests/test_cli_tools.py
          tests/test_feature_integration.py
          tests/test_cli_sources.py
          tests/test_wos.py
          tests/test_scopus.py
          tests/test_institutional_http.py
          tests/test_semantic_rate_limits.py
          tests/test_semantic_pdf_validation.py
          tests/test_cli_diagnostics.py
          tests/test_config_env.py
          tests/test_unpaywall.py
          tests/test_unpaywall_source.py
          tests/test_tool_schema_compat.py
          tests/test_mcp_stdio.py
          tests/test_server_transport.py
          tests/test_http_auth.py
          tests/test_stabilization_regressions.py
          tests/test_search_timeouts.py
          tests/test_google_scholar_errors.py
          tests/test_arxiv_406.py
          tests/test_arxiv.py::TestArxivRateLimiting
          tests/test_biorxiv_search_modes.py
          tests/test_openreview.py
          tests/test_ssrn_openalex.py
          tests/test_ssrn.py
          tests/test_openalex.py
          tests/test_openalex_relations.py
          tests/test_sections.py
          tests/test_search_cache.py
          tests/test_ieee.py
          tests/test_dsh_bundle.py
          tests/test_skill_archive_docs.py
          tests/test_skill_zip_builder.py
          tests/test_acm.py
          tests/test_fallback.py
          tests/test_paper.py
          tests/test_crossref_resolver.py
          tests/test_file_naming.py
          tests/test_server.py
          tests/test_cli_fallback.py
          -q --tb=short

      - name: Build package
        run: uv build

      - name: Verify wheel entry points
        run: |
          python -c "import pathlib, zipfile; wheel = next(pathlib.Path('dist').glob('paper_search_mcp-*.whl')); z = zipfile.ZipFile(wheel); entry = next(name for name in z.namelist() if name.endswith('.dist-info/entry_points.txt')); data = z.read(entry).decode(); assert 'paper-search-mcp = paper_search_mcp.server:main' in data; assert 'paper-search = paper_search_mcp.cli:main' in data; print(data)"

  publish:
    needs: test
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Build package
        run: uv build

      - name: Verify wheel entry points
        run: |
          python -c "import pathlib, zipfile; wheel = next(pathlib.Path('dist').glob('paper_search_mcp-*.whl')); z = zipfile.ZipFile(wheel); entry = next(name for name in z.namelist() if name.endswith('.dist-info/entry_points.txt')); data = z.read(entry).decode(); assert 'paper-search-mcp = paper_search_mcp.server:main' in data; assert 'paper-search = paper_search_mcp.cli:main' in data; print(data)"

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
